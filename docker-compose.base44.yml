services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: >-
      sh -c "npm install --global live-server@1.2.2 --silent &&
      live-server . --host=0.0.0.0 --port=3000 --no-browser --watch=."
    volumes:
      - .:/app
      - npm-cache:/root/.npm
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

volumes:
  npm-cache:
